name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Run deterministic regression and boundary tests
        run: npm test
      - name: Verify expected assertion failures
        run: npm run test:conformance
      - name: Verify clean packaged CLI and HTTP workflow
        run: npm run test:package
      - name: Verify the published Vercel AI SDK adapter surface
        if: matrix.node == '24'
        env:
          AGENTSPEC_AI_VERIFY_DIR: ${{ runner.temp }}/agentspec-ai
        run: |
          npm install --prefix "$AGENTSPEC_AI_VERIFY_DIR" ai@7.0.137 --ignore-scripts --no-save --no-package-lock
          npm run test:ai-sdk
      - name: Produce a JUnit report for the self-tests
        if: always()
        run: node dist/cli.js run --dir tests --mock --junit > results.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node }}
          path: results.xml